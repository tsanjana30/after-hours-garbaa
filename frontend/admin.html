<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>After-Hours Garba | Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #241329 0%,
                    #100c12 45%,
                    #09070a 100%
                );
            color: #ffffff;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================== */

        header {
            padding: 25px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(10, 8, 12, 0.9);
            backdrop-filter: blur(10px);

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            color: #f5d58a;
            font-size: 25px;
            font-weight: 700;
        }

        .logo span {
            color: #e7a6c8;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #a84f5b;
            color: #e7a6c8;

            padding: 10px 18px;
            border-radius: 8px;

            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #a84f5b;
            color: white;
        }

        /* =========================
           MAIN
        ========================== */

        main {
            width: 95%;
            max-width: 1200px;
            margin: 35px auto 60px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-title h1 {
            color: #f5d58a;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #aaa;
            font-size: 15px;
        }

        /* =========================
           LOGIN
        ========================== */

        #loginSection {
            max-width: 450px;
            margin: 80px auto;
            background: #141015;

            border: 1px solid rgba(245, 213, 138, 0.2);
            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #loginSection h2 {
            text-align: center;
            color: #f5d58a;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
        }

        .input-group input {
            width: 100%;

            padding: 14px;

            border-radius: 8px;
            border: 1px solid #39313b;

            background: #0d0a0f;
            color: white;

            outline: none;
        }

        .input-group input:focus {
            border-color: #f5d58a;
        }

        .login-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #b47b3b;
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #d0954d;
        }

        /* =========================
           DASHBOARD
        ========================== */

        #dashboard {
            display: none;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;

            margin-bottom: 35px;
        }

        .stat-card {
            background: #141015;

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;

            padding: 25px;

            min-height: 120px;
        }

        .stat-card .label {
            color: #8e8790;
            font-size: 14px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .stat-card .value {
            color: #f5d58a;
            font-size: 25px;
            font-weight: 700;
        }

        /* =========================
           TOOLBAR
        ========================== */

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;

            margin-bottom: 20px;
        }

        .toolbar h2 {
            color: #ffffff;
            font-size: 22px;
            margin-right: auto;
        }

        .refresh-btn {
            padding: 10px 18px;

            border: 1px solid #725b38;
            border-radius: 8px;

            background: #171218;
            color: #f5d58a;

            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #251d25;
        }

        /* =========================
           BOOKING CARD
        ========================== */

        .booking-card {
            background: #141015;

            border: 1px solid rgba(245, 213, 138, 0.2);

            border-radius: 18px;

            margin-bottom: 25px;

            overflow: hidden;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 25px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ticket-id {
            color: #e7a6c8;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .status {
            padding: 8px 14px;

            border-radius: 20px;

            font-size: 13px;
            font-weight: 600;

            color: #f5d58a;

            background: rgba(180, 123, 59, 0.12);

            border: 1px solid rgba(180, 123, 59, 0.35);
        }

        /* =========================
           BOOKING DETAILS
        ========================== */

        .booking-details {
            padding: 10px 25px 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;

            padding: 14px 0;

            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #8e8790;
        }

        .detail-value {
            color: #ffffff;
            font-weight: 600;
            text-align: right;
            word-break: break-word;
        }

        /* =========================
           PAYMENT SCREENSHOT
        ========================== */

        .screenshot-section {
            padding: 25px;

            text-align: center;

            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .screenshot-title {
            color: #8e8790;
            font-size: 14px;

            margin-bottom: 15px;

            text-transform: uppercase;
        }

        .payment-screenshot {
            display: none;

            max-width: 500px;
            max-height: 650px;

            width: auto;
            height: auto;

            margin: 0 auto;

            border-radius: 12px;

            border: 1px solid rgba(245, 213, 138, 0.25);

            background: #ffffff;

            object-fit: contain;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .screenshot-loading {
            color: #777;
            font-size: 14px;
        }

        .screenshot-error {
            color: #d97878;
            font-size: 14px;
            display: none;
        }

        /* =========================
           ACTION BUTTONS
        ========================== */

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 15px;

            padding: 25px;

            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .verify-btn,
        .reject-btn {
            padding: 16px;

            border: none;
            border-radius: 9px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }

        .verify-btn {
            background: #50a878;
            color: white;
        }

        .verify-btn:hover {
            background: #63bd8b;
        }

        .reject-btn {
            background: #a9505c;
            color: white;
        }

        .reject-btn:hover {
            background: #bd606c;
        }

        .verify-btn:disabled,
        .reject-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           EMPTY STATE
        ========================== */

        .empty-state {
            text-align: center;

            padding: 60px 20px;

            background: #141015;

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 18px;

            color: #999;
        }

        .empty-state h3 {
            color: #f5d58a;
            margin-bottom: 10px;
        }

        /* =========================
           MESSAGE
        ========================== */

        .message {
            text-align: center;
            margin-top: 15px;

            font-size: 14px;
        }

        .message.error {
            color: #e87878;
        }

        .message.success {
            color: #63bd8b;
        }

        .message.warning {
            color: #f5d58a;
        }

        .action-dialog {
            width: min(440px, calc(100vw - 32px));
            max-width: 100%;
            padding: 26px;
            border: 1px solid rgba(245, 213, 138, 0.35);
            border-radius: 16px;
            background: #211721;
            color: #fff;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
        }

        .action-dialog::backdrop {
            background: rgba(0, 0, 0, 0.72);
        }

        .action-dialog h2 {
            margin-bottom: 12px;
            color: #f5d58a;
        }

        .action-dialog p {
            color: #d8cbd8;
            line-height: 1.5;
            word-break: break-word;
        }

        .dialog-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .dialog-actions button {
            min-width: 110px;
            padding: 12px 16px;
            border-radius: 9px;
            cursor: pointer;
        }

        .dialog-cancel {
            border: 1px solid #725b38;
            background: transparent;
            color: #f5d58a;
        }

        .resend-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin: -4px 0 20px;
        }

        .resend-panel[hidden] {
            display: none;
        }

        .resend-panel input {
            flex: 1;
            min-width: 220px;
            padding: 11px;
            border: 1px solid #725b38;
            border-radius: 8px;
            background: #141015;
            color: #fff;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 768px) {

            header {
                padding: 18px;
            }

            .logo {
                font-size: 20px;
            }

            main {
                width: 92%;
                margin-top: 25px;
            }

            .page-title h1 {
                font-size: 27px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .booking-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .detail-row {
                flex-direction: column;
                gap: 5px;
            }

            .detail-value {
                text-align: left;
            }

            .actions {
                grid-template-columns: 1fr;
            }

            .payment-screenshot {
                max-width: 100%;
                max-height: 550px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>
        <div class="logo">
            Sri <span>Medha</span>
        </div>

        <button
            class="logout-btn"
            id="logoutButton"
            onclick="logout()"
            style="display: none;"
        >
            Logout
        </button>
    </header>


    <!-- =========================
         LOGIN SECTION
    ========================== -->

    <section id="loginSection">

        <h2>Admin Dashboard</h2>

        <div class="input-group">
            <label for="adminKey">
                Admin Key
            </label>

            <input
                type="password"
                id="adminKey"
                placeholder="Enter admin key"
                autocomplete="off"
            >
        </div>

        <button
            class="login-btn"
            onclick="login()"
        >
            Login
        </button>

        <div
            id="loginMessage"
            class="message"
        ></div>

    </section>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <main id="dashboard">

        <div class="page-title">

            <h1>
                After-Hours Garba
            </h1>

            <p>
                Payment Verification Dashboard
            </p>

        </div>


        <!-- =========================
             STATS
        ========================== -->

        <div class="stats">

            <div class="stat-card">

                <div class="label">
                    Pending Bookings
                </div>

                <div
                    class="value"
                    id="pendingCount"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="label">
                    Amount Awaiting
                </div>

                <div
                    class="value"
                    id="pendingAmount"
                >
                    ₹0
                </div>

            </div>


            <div class="stat-card">

                <div class="label">
                    Last Updated
                </div>

                <div
                    class="value"
                    id="lastUpdated"
                    style="font-size: 18px;"
                >
                    --
                </div>

            </div>

        </div>


        <!-- =========================
             TOOLBAR
        ========================== -->

        <div class="toolbar">

            <h2>
                Pending Payments
            </h2>

            <a class="refresh-btn" href="history.html" style="text-decoration: none;">
                View All Passes
            </a>

            <button
                class="refresh-btn"
                onclick="resendPass()"
            >
                ↻ Resend Pass
            </button>

            <button
                class="refresh-btn"
                onclick="loadBookings()"
            >
                ↻ Refresh
            </button>

        </div>

        <div id="resendPanel" class="resend-panel" hidden>
            <input id="resendTicketId" type="text" placeholder="Verified pass ID" aria-label="Verified pass ID">
            <button class="refresh-btn" type="button" onclick="sendResendPass()">Send pass</button>
        </div>


        <!-- =========================
             MESSAGE
        ========================== -->

        <div
            id="dashboardMessage"
            class="message"
        ></div>


        <!-- =========================
             BOOKINGS
        ========================== -->

        <div id="bookingsContainer"></div>

    </main>

    <dialog id="actionDialog" class="action-dialog" aria-labelledby="actionDialogTitle">
        <h2 id="actionDialogTitle">Confirm action</h2>
        <p id="actionDialogText"></p>
        <form method="dialog" class="dialog-actions">
            <button class="dialog-cancel" value="cancel">Cancel</button>
            <button id="actionDialogConfirm" class="verify-btn" value="confirm">Confirm</button>
        </form>
    </dialog>


    <script>

        /* =====================================
           CONFIGURATION
        ====================================== */

const API_URL = window.location.origin;

        function showDashboardMessage(message, type = "") {
            const element = document.getElementById("dashboardMessage");
            element.textContent = message;
            element.className = `message ${type}`.trim();
        }

        function confirmAdminAction(action, ticketId) {
            const dialog = document.getElementById("actionDialog");
            const verifying = action === "verify";
            document.getElementById("actionDialogTitle").textContent =
                verifying ? "Verify payment?" : "Reject payment?";
            document.getElementById("actionDialogText").textContent =
                `${ticketId} will be ${verifying ? "verified" : "rejected"}.`;
            const button = document.getElementById("actionDialogConfirm");
            button.textContent = verifying ? "Verify" : "Reject";
            button.className = verifying ? "verify-btn" : "reject-btn";
            dialog.returnValue = "";
            dialog.showModal();
            return new Promise((resolve) => {
                dialog.addEventListener("close", () => {
                    resolve(dialog.returnValue === "confirm");
                }, { once: true });
            });
        }

        /* =====================================
           LOGIN
        ====================================== */

        async function login() {

            const key =
                document
                    .getElementById("adminKey")
                    .value
                    .trim();

            const message =
                document.getElementById("loginMessage");


            if (!key) {

                message.textContent =
                    "Please enter the admin key.";

                message.className =
                    "message error";

                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/admin/pending`,
                        {
                            method: "GET",

                            headers: {
                                "x-admin-key": key
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok || !data.success) {

                    message.textContent =
                        data.message ||
                        "Invalid admin key.";

                    message.className =
                        "message error";

                    return;
                }


                /* Save key */

                sessionStorage.setItem(
                    "garbaAdminKey",
                    key
                );


                /* Show dashboard */

                document
                    .getElementById("loginSection")
                    .style.display = "none";

                document
                    .getElementById("dashboard")
                    .style.display = "block";

                document
                    .getElementById("logoutButton")
                    .style.display = "block";


                /* Display bookings */

                displayBookings(data.bookings);

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Could not connect to the server.";

                message.className =
                    "message error";
            }
        }


        /* =====================================
           CHECK EXISTING LOGIN
        ====================================== */

        window.addEventListener(
            "DOMContentLoaded",
            async function () {

                const savedKey =
                    sessionStorage.getItem(
                        "garbaAdminKey"
                    );


                if (!savedKey) {
                    return;
                }


                try {

                    const response =
                        await fetch(
                            `${API_URL}/api/admin/pending`,
                            {
                                headers: {
                                    "x-admin-key":
                                        savedKey
                                }
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        response.ok &&
                        data.success
                    ) {

                        document
                            .getElementById("loginSection")
                            .style.display = "none";

                        document
                            .getElementById("dashboard")
                            .style.display = "block";

                        document
                            .getElementById("logoutButton")
                            .style.display = "block";


                        displayBookings(
                            data.bookings
                        );

                    }

                    else {

                        sessionStorage.removeItem(
                            "garbaAdminKey"
                        );
                    }

                }

                catch (error) {

                    console.error(
                        "Auto-login error:",
                        error
                    );
                }
            }
        );


        /* =====================================
           LOAD BOOKINGS
        ====================================== */

        async function loadBookings() {

            const adminKey =
                sessionStorage.getItem(
                    "garbaAdminKey"
                );


            if (!adminKey) {

                logout();

                return;
            }


            const message =
                document.getElementById(
                    "dashboardMessage"
                );


            message.textContent =
                "Loading bookings...";

            message.className =
                "message";


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/admin/pending`,
                        {
                            method: "GET",

                            headers: {
                                "x-admin-key":
                                    adminKey
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    if (
                        response.status === 401
                    ) {

                        logout();

                        return;
                    }

                    throw new Error(
                        data.message ||
                        "Unable to load bookings."
                    );
                }


                displayBookings(
                    data.bookings
                );


                message.textContent = "";


            }

            catch (error) {

                console.error(error);

                message.textContent =
                    error.message ||
                    "Failed to load bookings.";

                message.className =
                    "message error";
            }
        }


        /* =====================================
           DISPLAY BOOKINGS
        ====================================== */

        function displayBookings(bookings) {

            const container =
                document.getElementById(
                    "bookingsContainer"
                );


            const countElement =
                document.getElementById(
                    "pendingCount"
                );


            const amountElement =
                document.getElementById(
                    "pendingAmount"
                );


            const updatedElement =
                document.getElementById(
                    "lastUpdated"
                );


            /* -------------------------------
               Stats
            -------------------------------- */

            countElement.textContent =
                bookings.length;


            const totalAmount =
                bookings.reduce(
                    function (sum, booking) {

                        return (
                            sum +
                            Number(
                                booking.amount || 0
                            )
                        );

                    },
                    0
                );


            amountElement.textContent =
                "₹" +
                totalAmount.toLocaleString(
                    "en-IN"
                );


            updatedElement.textContent =
                new Date().toLocaleTimeString(
                    "en-IN"
                );


            /* -------------------------------
               Empty state
            -------------------------------- */

            if (!bookings.length) {

                container.innerHTML = `
                    <div class="empty-state">

                        <h3>
                            No Pending Payments
                        </h3>

                        <p>
                            There are currently no
                            bookings waiting for payment
                            verification.
                        </p>

                    </div>
                `;

                return;
            }


            /* -------------------------------
               Booking cards
            -------------------------------- */

            container.innerHTML =
                bookings.map(
                    function (booking) {

                        const submittedDate =
                            booking.createdAt
                                ? new Date(
                                    booking.createdAt
                                ).toLocaleString(
                                    "en-IN"
                                )
                                : "N/A";


                        return `

                            <div
                                class="booking-card"
                                id="booking-${booking.ticketId}"
                            >

                                <!-- BOOKING HEADER -->

                                <div class="booking-header">

                                    <div class="ticket-id">
                                        ${escapeHtml(
                                            booking.ticketId
                                        )}
                                    </div>

                                    <div class="status">
                                        ${escapeHtml(
                                            booking.paymentStatus ||
                                            "PENDING_VERIFICATION"
                                        )}
                                    </div>

                                </div>


                                <!-- BOOKING DETAILS -->

                                <div class="booking-details">

                                    <div class="detail-row">

                                        <div class="detail-label">
                                            Name
                                        </div>

                                        <div class="detail-value">
                                            ${escapeHtml(
                                                booking.name
                                            )}
                                        </div>

                                    </div>


                                    <div class="detail-row">

                                        <div class="detail-label">
                                            Phone
                                        </div>

                                        <div class="detail-value">
                                            ${escapeHtml(
                                                booking.phone
                                            )}
                                        </div>

                                    </div>


                                    <div class="detail-row">

                                        <div class="detail-label">
                                            Email
                                        </div>

                                        <div class="detail-value">
                                            ${escapeHtml(
                                                booking.email
                                            )}
                                        </div>

                                    </div>


                                    <div class="detail-row">

                                        <div class="detail-label">
                                            Pass
                                        </div>

                                        <div class="detail-value">
                                            ${escapeHtml(
                                                booking.pass
                                            )}
                                        </div>

                                    </div>


                                    <div class="detail-row">

                                        <div class="detail-label">
                                            Quantity
                                        </div>

                                        <div class="detail-value">
                                            ${booking.quantity}
                                        </div>

                                    </div>


                                    <div class="detail-row">

                                        <div class="detail-label">
                                            Amount
                                        </div>

                                        <div class="detail-value">
                                            ₹${Number(
                                                booking.amount
                                            ).toLocaleString(
                                                "en-IN"
                                            )}
                                        </div>

                                    </div>


                                    <div class="detail-row">

                                        <div class="detail-label">
                                            Submitted
                                        </div>

                                        <div class="detail-value">
                                            ${submittedDate}
                                        </div>

                                    </div>


                                    <div class="detail-row">
                                        <div class="detail-label">Customer Email</div>
                                        <div class="detail-value">${escapeHtml(booking.bookingEmailStatus || "NOT_SENT")}</div>
                                    </div>

                                    <div class="detail-row">
                                        <div class="detail-label">Organizer Email</div>
                                        <div class="detail-value">${escapeHtml(booking.adminEmailStatus || "NOT_SENT")}</div>
                                    </div>

                                </div>


                                <!-- PAYMENT SCREENSHOT -->

                                <div class="screenshot-section">

                                    <div class="screenshot-title">
                                        Payment Screenshot
                                    </div>


                                    <div
                                        id="loading-${booking.ticketId}"
                                        class="screenshot-loading"
                                    >
                                        Loading payment screenshot...
                                    </div>


                                    <img
                                        id="screenshot-${booking.ticketId}"
                                        src=""
                                        alt="Payment Screenshot"
                                        class="payment-screenshot"
                                    >


                                    <div
                                        id="error-${booking.ticketId}"
                                        class="screenshot-error"
                                    >
                                        Unable to load payment screenshot.
                                    </div>

                                </div>


                                <!-- ACTION BUTTONS -->

                                <div class="actions">

                                    ${(booking.bookingEmailStatus !== "SENT" || booking.adminEmailStatus !== "SENT") ? `
                                    <button
                                        class="refresh-btn"
                                        style="grid-column: 1 / -1;"
                                        onclick="retryBookingEmails('${booking.ticketId}')"
                                    >
                                        ↻ RETRY EMAILS
                                    </button>` : ""}

                                    <button
                                        class="verify-btn"
                                        onclick="verifyPayment('${booking.ticketId}')"
                                    >
                                        ✓ VERIFY PAYMENT
                                    </button>


                                    <button
                                        class="reject-btn"
                                        onclick="rejectPayment('${booking.ticketId}')"
                                    >
                                        ✕ REJECT PAYMENT
                                    </button>

                                </div>

                            </div>

                        `;
                    }
                ).join("");


            /* -------------------------------
               Load screenshots AFTER
               HTML has been created
            -------------------------------- */

            bookings.forEach(
                function (booking) {

                    loadPaymentScreenshot(
                        booking.ticketId
                    );

                }
            );
        }


        /* =====================================
           LOAD PAYMENT SCREENSHOT
        ====================================== */

        async function loadPaymentScreenshot(
            ticketId
        ) {

            const img =
                document.getElementById(
                    `screenshot-${ticketId}`
                );


            const loading =
                document.getElementById(
                    `loading-${ticketId}`
                );


            const errorElement =
                document.getElementById(
                    `error-${ticketId}`
                );


            if (!img) {
                return;
            }


            try {

                const adminKey =
                    sessionStorage.getItem(
                        "garbaAdminKey"
                    );


                if (!adminKey) {

                    throw new Error(
                        "Admin authentication missing."
                    );
                }


                /*
                 * IMPORTANT:
                 *
                 * We use fetch() here because the
                 * screenshot endpoint requires
                 * x-admin-key.
                 */

                const response =
                    await fetch(
                        `${API_URL}/api/admin/payment-screenshot/${encodeURIComponent(
                            ticketId
                        )}`,
                        {
                            method: "GET",

                            headers: {
                                "x-admin-key":
                                    adminKey
                            }
                        }
                    );


                if (!response.ok) {

                    if (
                        response.status === 401
                    ) {

                        logout();

                        return;
                    }


                    throw new Error(
                        "Unable to load screenshot."
                    );
                }


                /*
                 * Convert the response into an
                 * image Blob.
                 */

                const blob =
                    await response.blob();


                /*
                 * Create a temporary browser URL
                 * for the image.
                 */

                const imageUrl =
                    URL.createObjectURL(
                        blob
                    );


                /*
                 * Put the image into <img>.
                 */

                img.src = imageUrl;

                img.style.display = "block";


                /*
                 * Hide loading message.
                 */

                if (loading) {

                    loading.style.display =
                        "none";
                }


                /*
                 * If image later gets removed,
                 * release the temporary URL.
                 */

                img.onload = function () {

                    console.log(
                        "Payment screenshot loaded:",
                        ticketId
                    );

                };

            }

            catch (error) {

                console.error(
                    "Screenshot loading error:",
                    ticketId,
                    error
                );


                if (loading) {

                    loading.style.display =
                        "none";
                }


                if (errorElement) {

                    errorElement.style.display =
                        "block";
                }
            }
        }


        /* =====================================
           RETRY BOOKING EMAILS
        ====================================== */

        async function retryBookingEmails(ticketId) {
            const adminKey = sessionStorage.getItem("garbaAdminKey");

            if (!adminKey) {
                logout();
                return;
            }

            showDashboardMessage("Retrying booking emails...");

            try {
                const response = await fetch(
                    `${API_URL}/api/admin/retry-booking-emails/${encodeURIComponent(ticketId)}`,
                    { method: "POST", headers: { "x-admin-key": adminKey } }
                );
                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 401) {
                        logout();
                        return;
                    }
                    throw new Error(data.message || "Could not retry booking emails.");
                }

                await loadBookings();
                showDashboardMessage(
                    `${data.message} Customer: ${data.bookingEmailStatus || "--"}. Organizer: ${data.adminEmailStatus || "--"}.`,
                    data.bookingEmailStatus === "SENT" && data.adminEmailStatus === "SENT" ? "success" : "warning"
                );
            } catch (error) {
                showDashboardMessage(error.message || "Could not retry booking emails.", "error");
            }
        }

        function resendPass() {
            const panel = document.getElementById("resendPanel");
            panel.hidden = !panel.hidden;
            if (!panel.hidden) document.getElementById("resendTicketId").focus();
        }

        async function sendResendPass() {
            const ticketId = document.getElementById("resendTicketId").value.trim();
            if (!ticketId) {
                showDashboardMessage("Enter a verified pass ID first.", "error");
                return;
            }

            const adminKey = sessionStorage.getItem("garbaAdminKey");

            if (!adminKey) {
                logout();
                return;
            }

            showDashboardMessage("Sending the pass...");

            try {
                const response = await fetch(
                    `${API_URL}/api/admin/resend-pass/${encodeURIComponent(ticketId)}`,
                    { method: "POST", headers: { "x-admin-key": adminKey } }
                );
                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 401) {
                        logout();
                        return;
                    }
                    throw new Error(data.message || "Could not resend the pass.");
                }

                showDashboardMessage(data.message || "Pass email request completed.", data.emailSent === false ? "warning" : "success");
                if (data.emailSent !== false) {
                    document.getElementById("resendPanel").hidden = true;
                    document.getElementById("resendTicketId").value = "";
                }
            } catch (error) {
                showDashboardMessage(error.message || "Could not resend the pass.", "error");
            }
        }


        /* =====================================
           VERIFY PAYMENT
        ====================================== */

        async function verifyPayment(
            ticketId
        ) {

            const confirmed = await confirmAdminAction("verify", ticketId);


            if (!confirmed) {
                return;
            }


            const adminKey =
                sessionStorage.getItem(
                    "garbaAdminKey"
                );

            if (!adminKey) {
                logout();
                return;
            }

            showDashboardMessage("Verifying payment...");


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/admin/verify/${encodeURIComponent(
                            ticketId
                        )}`,
                        {
                            method: "POST",

                            headers: {
                                "x-admin-key":
                                    adminKey
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    if (
                        response.status === 401
                    ) {

                        logout();

                        return;
                    }


                    throw new Error(
                        data.message ||
                        "Unable to verify payment."
                    );
                }


                /*
                 * Reload pending bookings.
                 */

                await loadBookings();

                showDashboardMessage(
                    data.emailSent === false
                        ? `${data.message} Pass ID: ${ticketId}. Use Resend Pass after fixing email settings.`
                        : (data.message || "Payment verified successfully."),
                    data.emailSent === false ? "warning" : "success"
                );

            }

            catch (error) {

                console.error(error);

                showDashboardMessage(
                    error.message || "Something went wrong while verifying payment.",
                    "error"
                );
            }
        }


        /* =====================================
           REJECT PAYMENT
        ====================================== */

        async function rejectPayment(
            ticketId
        ) {

            const confirmed = await confirmAdminAction("reject", ticketId);


            if (!confirmed) {
                return;
            }


            const adminKey =
                sessionStorage.getItem(
                    "garbaAdminKey"
                );

            if (!adminKey) {
                logout();
                return;
            }

            showDashboardMessage("Rejecting payment...");


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/admin/reject/${encodeURIComponent(
                            ticketId
                        )}`,
                        {
                            method: "POST",

                            headers: {
                                "x-admin-key":
                                    adminKey
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    if (
                        response.status === 401
                    ) {

                        logout();

                        return;
                    }


                    throw new Error(
                        data.message ||
                        "Unable to reject payment."
                    );
                }


                /*
                 * Reload pending bookings.
                 */

                await loadBookings();

                showDashboardMessage(data.message || "Payment rejected.", "success");

            }

            catch (error) {

                console.error(error);

                showDashboardMessage(
                    error.message || "Something went wrong while rejecting payment.",
                    "error"
                );
            }
        }


        /* =====================================
           LOGOUT
        ====================================== */

        function logout() {

            sessionStorage.removeItem(
                "garbaAdminKey"
            );


            document
                .getElementById("dashboard")
                .style.display = "none";


            document
                .getElementById("loginSection")
                .style.display = "block";


            document
                .getElementById("logoutButton")
                .style.display = "none";


            document
                .getElementById("adminKey")
                .value = "";


            document
                .getElementById("bookingsContainer")
                .innerHTML = "";
        }


        /* =====================================
           HTML ESCAPE
           Prevents booking data from being
           interpreted as HTML.
        ====================================== */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }


            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /* =====================================
           ENTER KEY LOGIN
        ====================================== */

        document
            .getElementById("adminKey")
            .addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter"
                    ) {

                        login();
                    }
                }
            );

    </script>
